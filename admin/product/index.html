<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Admin • Shopee</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap');
        
        body {
            font-family: 'Inter', system_ui, sans-serif;
        }
        
        .gaming-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .gaming-card:active {
            transform: scale(0.985);
        }
        
        .neon-green {
            color: #00ff9d;
        }
        
        .modal {
            animation: slideUp 0.3s ease-out;
        }
        
        @keyframes slideUp {
            from { transform: translateY(40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .toast {
            animation: slideDown 0.3s ease-out;
        }
        
        .product-image {
            transition: transform 0.3s ease;
        }
        
        .gaming-card:hover .product-image {
            transform: scale(1.05);
        }
        
        .admin-header {
            background: linear-gradient(to right, #111111, #1a1a1a);
        }
    </style>
</head>
<body class="bg-zinc-950 text-white">
    <!-- Header -->
    <div class="admin-header border-b border-zinc-800 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 bg-[#00ff9d] rounded-2xl flex items-center justify-center">
                    <i class="fas fa-gamepad text-black text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-black tracking-tight">Gaming Admin</h1>
                    <p class="text-xs text-zinc-400 -mt-1">Shopee Affiliate CMS</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2 text-sm">
                <div class="px-3 py-1 bg-zinc-900 rounded-full text-xs flex items-center gap-1.5">
                    <div class="w-2 h-2 bg-emerald-400 rounded-full animate-pulse"></div>
                    <span class="text-emerald-400">Online</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="max-w-5xl mx-auto px-4 py-6">
        
        <!-- Stats Bar -->
        <div class="flex items-center justify-between mb-6">
            <div>
                <div class="text-3xl font-black" id="product-count">0</div>
                <div class="text-sm text-zinc-400">Sản phẩm</div>
            </div>
            
            <div class="text-right">
                <div class="text-xs text-zinc-500">Cập nhật gần nhất</div>
                <div class="text-sm font-medium text-emerald-400" id="last-update">Vừa xong</div>
            </div>
        </div>

        <!-- Products Grid -->
        <div id="products-grid" class="grid grid-cols-1 gap-4">
            <!-- JS will render cards here -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center py-16">
            <i class="fas fa-box-open text-7xl text-zinc-700 mb-6"></i>
            <h3 class="text-2xl font-bold mb-2">Chưa có sản phẩm nào</h3>
            <p class="text-zinc-400 mb-8">Nhấn nút + để thêm sản phẩm đầu tiên</p>
            <button onclick="openAddModal()" 
                    class="px-8 py-3.5 bg-[#00ff9d] text-black font-extrabold rounded-2xl flex items-center gap-3 mx-auto">
                <i class="fas fa-plus"></i>
                <span>THÊM SẢN PHẨM</span>
            </button>
        </div>
    </div>

    <!-- Floating Action Button -->
    <button onclick="openAddModal()"
            class="fixed bottom-6 right-6 w-16 h-16 bg-[#00ff9d] text-black rounded-2xl shadow-[0_10px_30px_rgb(0,255,157,0.4)] flex items-center justify-center z-50 active:scale-90 transition-all">
        <i class="fas fa-plus text-3xl"></i>
    </button>

    <!-- Modal Add/Edit -->
    <div id="modal" class="hidden fixed inset-0 bg-black/90 z-[100] flex items-end md:items-center justify-center">
        <div class="bg-zinc-900 w-full md:w-[420px] rounded-t-3xl md:rounded-3xl p-6 modal">
            
            <!-- Modal Header -->
            <div class="flex items-center justify-between mb-6">
                <h3 id="modal-title" class="text-2xl font-black">Thêm sản phẩm mới</h3>
                <button onclick="closeModal()" class="w-10 h-10 flex items-center justify-center text-xl text-zinc-400 hover:text-white">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <!-- Form -->
            <form id="product-form" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="product-id">
                
                <div class="space-y-5">
                    <!-- Tên sản phẩm -->
                    <div>
                        <label class="block text-sm font-semibold text-zinc-400 mb-2">TÊN SẢN PHẨM</label>
                        <input type="text" id="gaming_name" required
                               class="w-full bg-zinc-800 border border-zinc-700 focus:border-[#00ff9d] rounded-2xl px-4 py-3.5 text-white placeholder-zinc-500 text-lg"
                               placeholder="Free Fire Account VIP 2026">
                    </div>

                    <!-- Link Shopee -->
                    <div>
                        <label class="block text-sm font-semibold text-zinc-400 mb-2">LINK SHOPEE</label>
                        <input type="url" id="gaming_link" required
                               class="w-full bg-zinc-800 border border-zinc-700 focus:border-[#00ff9d] rounded-2xl px-4 py-3.5 text-white placeholder-zinc-500"
                               placeholder="https://shopee.vn/...">
                    </div>

                    <!-- Link Ảnh -->
                    <div>
                        <label class="block text-sm font-semibold text-zinc-400 mb-2">LINK ẢNH (Gaming Image)</label>
                        <input type="url" id="gaming_image" required
                               class="w-full bg-zinc-800 border border-zinc-700 focus:border-[#00ff9d] rounded-2xl px-4 py-3.5 text-white placeholder-zinc-500"
                               placeholder="https://...jpg">
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex gap-3 mt-8">
                    <button type="button" onclick="closeModal()"
                            class="flex-1 py-4 bg-zinc-800 hover:bg-zinc-700 font-bold rounded-2xl transition">
                        HỦY
                    </button>
                    <button type="submit" id="submit-btn"
                            class="flex-1 py-4 bg-[#00ff9d] text-black font-extrabold rounded-2xl flex items-center justify-center gap-2 transition active:scale-[0.985]">
                        <span id="submit-text">LƯU SẢN PHẨM</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[200]"></div>

    <script src="../Services/product.js"></script>
</body>
</html>
